name: Alchemy read-only readiness

on:
  push:
    branches: [main, feature/alchemy-readonly-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Read-only adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  rpc-readiness:
    name: Alchemy RPC readiness (read-only)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && secrets.ALCHEMY_API_KEY != '' }}
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only RPC probes
        run: npm run alchemy:readiness
